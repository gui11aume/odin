# Odin VAE training config (see runners/run_train_odin_vae.py).
# Shards are built by runners/build_odin_shards.py into data_root.

seed: 123
data_root: /mnt/nvme1/odin_wds

splits:
  train:
    dataset:
      pattern: "train/shard-{000000..002189}.tar.gz"
      n_instances_per_shard: 2048
    dataloader:
      # Sweep stage 1+2 winner: smaller effective batch beats 256/512/1024
      # monotonically at lr 5e-4 (more optimizer steps per epoch under OneCycle).
      batch_size: 128
      drop_last_batch: false
      num_workers: 4
      persistent_workers: false
      pin_memory: true
  val:
    dataset:
      pattern: "val/shard-{000000..000002}.tar.gz"
      n_instances_per_shard: 2048
    # 3 val shards / 2 DDP ranks -> 2+1 split: a single worker keeps every
    # rank non-empty (webdataset's check_empty would otherwise fire).
    dataloader:
      batch_size: 256
      drop_last_batch: false
      num_workers: 1
      persistent_workers: false
      pin_memory: true

augmentation:
  rate: 0.015
  confusion_weight: 0.7
  # k is drawn uniformly from 1..k_input per cluster (real patent families
  # have one surface per member); targets are tag-primed 50% of the time.
  k_input: 4
  k_latin_target: 4
  k_non_latin_target: 2
  # Cap on surface length incl. the tag token; the batch's padded length, so
  # keeping it tight is what keeps memory flat. v2 surfaces longer than the
  # cap were dropped at merge time (runners/merge_odin_trainset.py).
  max_surface_tokens: 48

model:
  tokenizer_path: /mnt/nvme1/odin_tokenizer
  hidden_size: 128
  attention_heads: 4
  intermediate_size: 512
  encoder_layers: 4
  decoder_layers: 6
  local_attention: 32
  max_position_embeddings: 64
  decoder: modernbert
  kl_weight: 1.0e-3

training:
  lr: 5.0e-4
  # Sweep: 0.02 edged out 0.05/0.1 at the 1-epoch point (2.154 vs 2.160/2.168).
  lr_warmup_ratio: 0.02
  optimizer: AdamW
  optimizer_kwargs:
    betas: [0.9, 0.999]
    weight_decay: 0.01
  accelerator: gpu
  devices: 2
  strategy: ddp
  precision: bf16-mixed
  max_epochs: 10
  # <= 0: auto -> one full pass over the train shards per epoch (per rank).
  limit_train_batches: -1
  val_check_interval: 1.0
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  generation_log_every_n_steps: 500
  n_generation_clusters: 3
  checkpoint_path: null
