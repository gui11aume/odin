# Odin VAE training config (see runners/run_train_odin_vae.py).
# Shards are built by runners/build_odin_shards.py into data_root.

seed: 123
# v4 (inventor-only): the phase-4 repaired inventor corpus, companies excluded.
# train 4,253,801 / val 5,996 / test 3,000. See /mnt/nvme1/odin_wds_v3/manifest.json.
data_root: /mnt/nvme1/odin_wds_v3

splits:
  train:
    dataset:
      pattern: "train/shard-{000000..002077}.tar.gz"
      n_instances_per_shard: 2048
    dataloader:
      # Sweep stage 1+2 winner: smaller effective batch beats 256/512/1024
      # monotonically at lr 5e-4 (more optimizer steps per epoch under OneCycle).
      batch_size: 128
      drop_last_batch: false
      num_workers: 4
      persistent_workers: false
      pin_memory: true
  val:
    dataset:
      pattern: "val/shard-{000000..000015}.tar.gz"
      n_instances_per_shard: 375
    # 16 small val shards (5,996 clusters, 15x375 + 371): webdataset splits
    # the shard list across DDP ranks, so this keeps every rank non-empty up
    # to 16 training GPUs (a rank with 0 shards hangs the validation loop).
    # A single worker keeps each rank's own shard split non-empty as well.
    dataloader:
      batch_size: 256
      drop_last_batch: false
      num_workers: 1
      persistent_workers: false
      pin_memory: true
  # Never trained on and never used for selection (epoch/hyperparameter);
  # evaluated only after training via trainer.test. 16 shards -> 1 GPU per
  # rank up to 16 GPUs.
  test:
    dataset:
      pattern: "test/shard-{000000..000015}.tar.gz"
      n_instances_per_shard: 188
    dataloader:
      batch_size: 256
      drop_last_batch: false
      num_workers: 1
      persistent_workers: false
      pin_memory: true

augmentation:
  rate: 0.015
  confusion_weight: 0.7
  # k (input surfaces per cluster) is drawn from 1..k_input with these
  # weights: geometric decay over-weights the single-surface, low-information
  # regime that production sees most (50% one-surface clusters). k_input is
  # 8 here (we infer with up to 12 surfaces; training had only seen <=4).
  k_input: 8
  k_input_weights: [0.5, 0.25, 0.125, 0.0625, 0.03125, 0.015625, 0.0078125, 0.00390625]
  k_latin_target: 4
  k_non_latin_target: 2
  # Cap on surface length incl. the tag token; the batch's padded length, so
  # keeping it tight is what keeps memory flat. v2 surfaces longer than the
  # cap were dropped at merge time (runners/merge_odin_trainset.py).
  max_surface_tokens: 48

model:
  tokenizer_path: /mnt/nvme1/odin_tokenizer
  hidden_size: 128
  attention_heads: 4
  intermediate_size: 512
  encoder_layers: 4
  decoder_layers: 6
  local_attention: 32
  max_position_embeddings: 64
  decoder: modernbert
  # klprobe (1-epoch, v3, S=4, geometric k): beta 1e-2/0.03/0.1 kept the
  # selectivity margin flat (median 1.76-1.92) while the posterior became
  # informative -- "J. Smith" carried a wider posterior than "John Allan
  # Smith" (ratio up to 1.4x); 0.3 collapsed onto the prior (margin 1.10,
  # val_ce +27%). 1e-2 picked: clearest ordering + best 1-epoch val_ce.
  kl_weight: 1.0e-2
  # Multi-sample ELBO: decode S reparameterized latents per cluster per step
  # and average the CE. S=4 makes the learned posterior variance reflect
  # expected decode quality (lower reconstruction gradient variance).
  num_latent_samples: 4

training:
  lr: 5.0e-4
  # Sweep: 0.02 edged out 0.05/0.1 at the 1-epoch point (2.154 vs 2.160/2.168).
  lr_warmup_ratio: 0.02
  optimizer: AdamW
  optimizer_kwargs:
    betas: [0.9, 0.999]
    weight_decay: 0.01
  accelerator: gpu
  devices: 2
  strategy: ddp
  precision: bf16-mixed
  max_epochs: 15
  # <= 0: auto -> one full pass over the train shards per epoch (per rank).
  limit_train_batches: -1
  val_check_interval: 1.0
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  generation_log_every_n_steps: 500
  n_generation_clusters: 3
  checkpoint_path: null
