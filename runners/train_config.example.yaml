datamodule:
  train_text_path: tests/fixtures/mlm_lines_train.txt
  val_text_path: tests/fixtures/mlm_lines_val.txt
  dataloader:
    batch_size: 2
    drop_last_batch: false
    num_workers: 0
    persistent_workers: false
    pin_memory: false
  collator:
    max_seq_length: 128
    mlm_probability: 0.15

models:
  tokenizer: {}
  modern_bert:
    pretrained_model_name_or_path: allenai/modernbert-base

training:
  lr: 2.5e-5
  lr_warmup_ratio: 0.06
  optimizer: AdamW
  optimizer_kwargs:
    betas: [0.9, 0.98]
    weight_decay: 0.01

  accelerator: auto
  devices: 1
  strategy: auto
  precision: bf16-mixed

  accumulate_grad_batches: 1
  max_epochs: 2
  max_steps: -1
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  num_sanity_val_steps: 0
  log_every_n_steps: 50
  val_check_interval: 1.0
  checkpoint_path: null
