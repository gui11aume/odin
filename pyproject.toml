[project]
name = "odin"
version = "1.0.0"
description = "The many-named one"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Guillaume Filion", email = "guillaume.filion@gmail.com"}
]
dependencies = [
    "torch>=2.11.0",
    "transformers>=5.8.1",
    "tokenizers>=0.22.0",
    "lightning>=2.5.0,<3",
    "vllm>=0.25.1",
    "openai>=2.48.0",
    "opencc-python-reimplemented>=0.1.7",
    "pydantic>=2.10.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.2",
    "ty==0.0.18",
    "pytest>=8.3.4",
    "pre-commit>=3.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odin"]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "runners", "tests"]
extend-exclude = ["test_scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
